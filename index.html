<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Bible Paragraph - 본문삽입 전용</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">Web-Bible-Paragraph</div>
    <div class="spacer"></div>
    <button id="btnInsert">본문삽입</button>
  </header>

  <main>
    <section id="editor">
      <div class="panel head">
        <input id="refInput" placeholder="예: 창 1:1-3,6-8; 2:1" />
      </div>
      <div id="doc" class="editor" contenteditable="true" spellcheck="false"></div>
    </section>
  </main>

  <footer>
    <small>© 2025 Web-Bible-Paragraph Minimal</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
