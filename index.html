<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Bible Paragraph 3.0</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">Web-Bible-Paragraph <span class="ver">v3.0.0-alpha</span></div>
    <div class="spacer"></div>
    <div class="toolbar">
      <button id="btnImport" title="설교 불러오기(JSON)">불러오기</button>
      <button id="btnInsert" title="본문 삽입">본문삽입</button>
      <button id="btnExport" title="설교 내보내기(JSON)">내보내기</button>
      <button id="btnClear"  title="로컬 저장 초기화">초기화</button>
      <div class="divider"></div>
      <button id="btnTrace"  title="설교추적 시작/중지">설교추적시작</button>
      <button id="btnTTS"    title="낭독/정지 토글">낭독</button>
    </div>
  </header>

  <!-- ✅ 좌측 패널 및 '에디터 (자동저장됨)' 제거, 에디터만 남김 -->
  <main style="padding:0 8px;">
    <div id="doc" class="editor" contenteditable="true" spellcheck="false"></div>
  </main>

  <footer>
    <small>© 2025 Web-Bible-Paragraph 3.0 — MVP</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
